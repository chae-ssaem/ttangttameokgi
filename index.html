<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>품사 땅따먹기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 상단 바 → (품사 지도 | 진행 패널) 2단, 좁으면 1단. 지도는 5언 섬 + 가운데 요새 다리 */
:root{
  color-scheme: light;
  --sea:#CFE6EC; --sea-line:#B5D6DF;
  --paper:#FFFDF7; --ink:#1F2B3D; --muted:#5E6B7A; --line:#D9DED8;
  --accent:#E8553D; --gold:#F2B33D; --ok:#1E9E62; --no:#D9483B;
  --che:#FBE2CF; --che-d:#E59A63;
  --yong:#D6F0DC; --yong-d:#4FA86A;
  --su:#E7DDF6; --su-d:#8C6BC4;
  --gwan:#D6E8FA; --gwan-d:#4C88C7;
  --dok:#FCF0C2; --dok-d:#C9A227;
  --fort:#EEE7DA; --fort-d:#8A7354;
  --f-display:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 2px, transparent 3px),radial-gradient(circle at 70% 80%, rgba(255,255,255,.3) 0 2px, transparent 3px);
  background-size:46px 46px, 60px 60px}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* 상단 바 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand small{font:800 10px/1 var(--f-body);letter-spacing:.18em;color:var(--accent)}
.brand b{font:400 30px/1.1 var(--f-display);letter-spacing:.01em}
.top .sp{flex:1}
.pill{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.ibtn{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* 본문 2단 */
.main{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}}

/* 지도: 바다 위 5언 섬 + 가운데 해협의 쌍둥이 요새 */
.mapbox{border-radius:26px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);overflow:hidden;background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:var(--paper);border-top:3px solid var(--ink);font-size:13px;font-weight:600;color:var(--muted)}
.mapcap b{color:var(--ink)}
.hex .hx{transition:fill .3s}
.hex.pop, .castle.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg)}100%{transform:scale(1)}}
.castle.can, .hex.can{cursor:pointer}
.hex.can:hover .hx, .hex.can:focus-visible .hx{stroke:#E8553D;stroke-width:4}
.hex.tgt .hx{stroke:#E8553D;stroke-width:5;animation:tgt 1s ease-in-out infinite}
@keyframes tgt{50%{stroke-width:2}}
.hex:focus{outline:none}
.castle.pick .ring{animation:ring 1.1s ease-in-out infinite}
@keyframes ring{50%{stroke-opacity:.15;stroke-width:12}}
.castle.can:hover .islet, .castle.can:focus-visible .islet{fill:#FFE7A8}
.castle:focus{outline:none}
.castle:focus-visible .ring{stroke:var(--ink)}
.wave{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* 패널 */
.panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}
@media (max-width:980px){.panel{position:static;order:-1}}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px}
.turn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 14px 4px 6px;background:var(--tc);color:#fff;font:400 22px/1.2 var(--f-display)}
.chip i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--tc);display:grid;place-items:center;font-size:16px}
.turn .r{margin-left:auto;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.big{border:2.5px solid var(--ink);border-radius:16px;padding:14px 10px;background:#fff;box-shadow:0 5px 0 var(--ink);text-align:center}
.big b{display:block;font:400 24px/1.15 var(--f-display)}
.big small{color:var(--muted);font-weight:600}
.big.land{background:#FFF1E6} .big.fortb{background:#F4EDE1}
.big:disabled{opacity:.45;cursor:not-allowed}
.big:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.sent{font:500 clamp(20px,2.1vw,28px)/1.6 var(--f-body);margin:6px 0 4px;text-wrap:balance;word-break:keep-all}
.sent u{text-decoration:none;background:linear-gradient(transparent 58%, #FFD44D 58%);font-weight:900;padding:0 2px;border-bottom:3px solid var(--ink)}
.q{color:var(--muted);font-weight:700;font-size:14px}
.ans{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.arow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.arow > span{width:52px;flex:none;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pbtn{flex:1 1 0;min-width:64px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:7px 4px;font:400 19px/1.1 var(--f-display);box-shadow:0 3px 0 var(--ink)}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pbtn.sel{background:var(--ink);color:#fff}
.pbtn.c-che{background:var(--che)} .pbtn.c-yong{background:var(--yong)} .pbtn.c-su{background:var(--su)} .pbtn.c-gwan{background:var(--gwan)} .pbtn.c-dok{background:var(--dok)}
.pbtn.sel{background:var(--ink);color:#fff}
.timer{height:8px;border-radius:99px;background:#EDEBE4;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.tmtx{font-size:12px;color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.res{border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:600}
.res.ok{background:#E3F5EA;border:2px solid var(--ok)}
.res.no{background:#FCE6E3;border:2px solid var(--no)}
.res.info{background:#F1EFE8;border:2px solid var(--line)}
.res b.h{display:block;font:400 22px/1.2 var(--f-display);margin-bottom:2px}
.res.ok b.h{color:var(--ok)} .res.no b.h{color:var(--no)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:2.5px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--gold);font:400 20px/1.1 var(--f-display);box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.steal{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.steal .chip{border:0;cursor:pointer}
.fq{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;background:#fff}
.fq .lab{font:400 18px/1 var(--f-display);color:var(--fort-d)}
.fq .sent{font-size:clamp(18px,1.8vw,24px);margin:4px 0 6px}
.mini{display:flex;flex-wrap:wrap;gap:5px}
.mini .pbtn{flex:0 0 auto;min-width:0;padding:6px 10px;font-size:17px;box-shadow:0 2px 0 var(--ink)}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.step{margin-top:12px;font-weight:800;font-size:15px;color:var(--ink)}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:4px}
.step.sm{margin-top:8px;font-size:13px}
.means{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
@media (max-width:520px){.means{grid-template-columns:1fr}}
.mopt{text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:7px 10px;font:600 14px/1.35 var(--f-body);box-shadow:0 2px 0 var(--ink);word-break:keep-all}
.mopt:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.mopt.sel{background:var(--ink);color:#fff}
.fq .mopt{font-size:13px;padding:6px 8px}
.defl{font-weight:800;margin:2px 0 4px}
.res.gold{background:#FFF3C9;border:2px solid var(--gold)}
.res.gold b.h{color:#9A6A00}
.tres{margin-top:8px;padding:8px 10px;border-radius:10px;background:#FFF3C9;border:2px dashed var(--gold);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.mapbox.gold{border-color:#B8860B;box-shadow:0 0 0 5px var(--gold), 0 8px 0 var(--ink)}
.mapbox.gold svg{filter:saturate(1.15) sepia(.18)}
.pill.goldp{background:#FFF3C9;border-color:#B8860B}
.ev{display:grid;gap:8px}
.ev > div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14.5px}
.ev b:first-child{display:block;font:400 18px/1.3 var(--f-display)}
.gifts{display:block;margin-top:4px;color:var(--muted);font-weight:700;font-size:13px}

/* 점수판 */
.score h3{margin:0 0 8px;font:400 22px/1 var(--f-display)}
.srow{display:grid;grid-template-columns:auto 1fr auto auto auto auto auto;align-items:center;gap:10px;padding:6px 4px;border-top:1.5px dashed var(--line);font-variant-numeric:tabular-nums}
.srow:first-of-type{border-top:0}
.srow .dot{width:16px;height:16px;border-radius:50%;background:var(--tc);border:2px solid var(--ink)}
.srow .nm{font-weight:800}
.srow .m{font-size:13px;color:var(--muted);font-weight:600}
.srow .t{font:400 24px/1 var(--f-display);min-width:42px;text-align:right}
.srow.now{background:#FFF6DB;border-radius:10px}

/* 시작 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero h1{font:400 clamp(44px,7vw,84px)/1 var(--f-display);margin:0 0 10px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:18px;max-width:34em;margin:0 0 14px}
.book{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:0 18px 16px;
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(31,43,61,.045) 31px 32px)}
.book-h{display:flex;align-items:baseline;gap:10px;margin:0 -18px 6px;padding:12px 18px;background:var(--ink);color:#fff;border-radius:16px 16px 0 0}
.book-h b{font:400 26px/1 var(--f-display);letter-spacing:.02em}
.book-h small{margin-left:auto;font-weight:700;opacity:.8}
.book section{padding:10px 0;border-top:2px dashed var(--line)}
.book section:first-of-type{border-top:0}
.book h3{margin:0 0 6px;font:400 20px/1.2 var(--f-display)}
.book p{margin:0;font-size:15px}
.goal p{font-size:16px}
.ico{width:26px;height:26px;flex:none;vertical-align:middle}
.kit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.kit{grid-template-columns:1fr}}
.kit > div{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.kit .ico{grid-row:span 2;width:32px;height:32px}
.kit b{font-size:14px} .kit small{color:var(--muted);font-size:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.steps li b.t{display:block;font-size:15.5px}
.sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center;font:400 18px/1 var(--f-display)}
.ptab{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.ptab td{padding:4px 6px;border-bottom:1px solid var(--line)}
.ptab td .ico{width:20px;height:20px;margin-right:4px}
.ptab .plus{color:var(--ok);font:400 20px/1 var(--f-display);text-align:right;padding-right:14px}
.ptab .minus{color:var(--no);font:400 20px/1 var(--f-display);text-align:right}
.pnote{margin-top:6px!important;font-size:13px!important;color:var(--muted);font-weight:700}
.notes{margin:0;padding-left:18px;font-size:14.5px;display:flex;flex-direction:column;gap:2px}

.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;border:2px solid rgba(31,43,61,.15)}
.rules li b.k{flex:none;font:400 18px/1.4 var(--f-display);background:var(--ink);color:#fff;border-radius:8px;padding:0 8px}
.set h3{margin:0 0 6px;font:400 20px/1.2 var(--f-display)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:8px 14px;font:400 19px/1 var(--f-display);box-shadow:0 3px 0 var(--ink)}
.opt.on{background:var(--ink);color:#fff}
.teams{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* 결과 */
.endg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.endg{grid-template-columns:1fr}}
.podium h2{font:400 40px/1 var(--f-display);margin:0 0 12px}
.rank{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:#fff;border:2px solid var(--line)}
.rank .no{font:400 30px/1 var(--f-display);width:34px;text-align:center}
.rank.first{background:#FFF3C9;border-color:var(--gold)}
.rank .t{margin-left:auto;font:400 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.li .s{font-weight:600}
.li .s u{text-decoration:none;border-bottom:2.5px solid var(--ink);background:linear-gradient(transparent 60%, #FFE58A 60%);font-weight:900}
.li .a{font-size:14px;color:var(--muted)}
.li .a b{color:var(--ink)}
.confirm{display:flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--no);border-radius:12px;padding:4px 6px 4px 12px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===== 데이터 ===== */
const ISLANDS = [
  { key:'che', name:'체언', sub:'명사·대명사·수사', poses:['명사','대명사','수사'] },
  { key:'yong', name:'용언', sub:'동사·형용사', poses:['동사','형용사'] },
  { key:'su', name:'수식언', sub:'관형사·부사', poses:['관형사','부사'] },
  { key:'gwan', name:'관계언', sub:'조사', poses:['조사'] },
  { key:'dok', name:'독립언', sub:'감탄사', poses:['감탄사'] },
];
const ISL_OF = {}; ISLANDS.forEach(i => i.poses.forEach(p => ISL_OF[p] = i.key));
const ISLE_NAME = { che:'초록섬', yong:'주황섬', su:'보라섬', gwan:'파랑섬', dok:'노랑섬' };
const VILLAGE = { '명사':'솔숲 마을', '대명사':'모래 마을', '수사':'등대 마을', '동사':'풍차 마을', '형용사':'언덕 마을',
  '관형사':'꽃밭 마을', '부사':'샘물 마을', '조사':'구름 마을', '감탄사':'무지개 마을' };
const DEF = {
  '명사':'대상의 이름을 나타내는 단어',
  '대명사':'사람, 사물, 장소 등의 이름을 대신하여 가리키는 단어',
  '수사':'수량이나 순서를 나타내는 단어',
  '동사':'사람이나 사물의 움직임을 나타내는 단어',
  '형용사':'사람이나 사물의 성질이나 상태를 나타내는 단어',
  '관형사':'체언을 꾸며 주는 단어',
  '부사':'주로 용언을 꾸며 주는 단어',
  '조사':'주로 체언 뒤에 붙어 그 말과 다른 말의 문법적 관계를 나타내거나 뜻을 더해 주는 단어',
  '감탄사':'느낌, 부름, 대답 등을 나타내는 단어',
};
const LAND_PEN = 1, STEAL_PEN = 2, FORT_PEN = 2;
const CELLS = 4;
const POS_ORDER = ['명사','대명사','수사','동사','형용사','관형사','부사','조사','감탄사'];
const landNo = (p, k) => POS_ORDER.indexOf(p) * CELLS + k + 1;

/* [ ]안이 밑줄 친 말 */
const CARDS = [
  ['[사랑]은 모든 것을 이겨 낸다.','명사','‘사랑’이라는 대상의 이름을 나타내요.'],
  ['우리는 [운동장]에서 축구를 했다.','명사','장소의 이름을 나타내요.'],
  ['[오늘]은 소풍 가는 날이다.','명사','날의 이름을 나타내고 조사 ‘은’과 결합했어요.'],
  ['할머니께서 [떡]을 만드셨다.','명사','음식의 이름을 나타내요.'],
  ['[바다]가 정말 넓다.','명사','대상의 이름을 나타내고 조사 ‘가’와 결합했어요.'],
  ['[나]는 국어 시간이 제일 좋아.','대명사','말하는 사람을 대신 가리켜요.'],
  ['[여기]가 우리 학교야.','대명사','장소를 대신 가리켜요.'],
  ['[우리]는 같은 반이다.','대명사','말하는 사람을 포함한 여럿을 대신 가리켜요.'],
  ['[이것]을 들어 줄래?','대명사','사물을 대신 가리키고 조사 ‘을’과 결합했어요.'],
  ['[누구]를 기다리니?','대명사','모르는 사람을 가리켜요.'],

    <div class="card podium"><h2>품사 대륙의 주인은?</h2>${ranks}<div class="row2"><button class="btn" data-act="restart">다시 하기</button></div></div>
    <div class="card"><h3 style="margin:0 0 8px;font:400 22px/1 var(--f-display)">헷갈렸던 땅 카드</h3><div class="list">${wrong}</div></div>
    <div class="card" style="grid-column:1/-1"><h3 style="margin:0 0 8px;font:400 22px/1 var(--f-display)">쌍둥이 요새 정답</h3><div class="list">${forts}</div></div>
  </div>`;
}
function render(){
  const app = document.getElementById('app');
  let body = '';
  if (S.phase === 'setup') body = setupHTML();
  else if (S.phase === 'play') body = `<div class="main">${mapHTML()}${panelHTML()}</div>`;
  else body = endHTML();
  app.innerHTML = topHTML() + body;
  S.lastCell = null; S.lastFort = null;
}

/* ===== 진행 ===== */
const isLastTurn = () => S.rounds && S.round === S.rounds && S.turn === S.teams.length - 1;
function drawCard(){
  if (!S.deck.length) S.deck = shuffle(CARDS.map(c => c.id));
  S.card = CARDS[S.deck.pop()]; S.pick = {}; S.mopts = meanOpts(S.card.p);
}
function reshuffleCard(){ if (S.card && !S.deck.includes(S.card.id)) S.deck.splice(Math.floor(Math.random() * (S.deck.length + 1)), 0, S.card.id); }
function targetHTML(){
  if (!S.target) return '';
  const { p, k } = S.target, o = S.cells[p][k];
  return `<div class="q" style="margin-top:10px">🎯 <b style="color:var(--ink)">${landNo(p, k)}번 땅</b> 도전 · ${o >= 0 ? `${T(o).name} 땅 빼앗기 (실패하면 −${STEAL_PEN}점)` : '빈 땅 차지하기'}</div>`;
}
function claimAt(team, p, k){
  const prev = S.cells[p][k], no = landNo(p, k);
  if (prev === team) return `${T(team).name}이 <b>${no}번 땅</b>을 지켜 냈어요!`;
  S.cells[p][k] = team; S.lastCell = [p, k];
  const g = golden(); if (g) S.bonus[team] = bonusOf(team) + 1;
  const pts = g ? '(+2점 ⭐)' : '(+1점)';
  let msg = prev >= 0 ? `${T(team).name}이 ${T(prev).name}의 <b>${no}번 땅</b>을 빼앗았어요! ${pts}` : `${T(team).name}이 <b>${no}번 땅</b>을 차지했어요. ${pts}`;
  if (prev < 0){ const tr = openTreasure(team, p, k); if (tr) msg += `<div class="tres">${tr}</div>`; }
  return msg;
}
function claimLand(team, pos){
  const arr = S.cells[pos], k = arr.indexOf(-1);
  if (k >= 0){ arr[k] = team; S.lastCell = [pos, k]; return `${T(team).name}이 <b>${landNo(pos, k)}번 ${pos}</b> 땅을 차지했어요. (+1점)`; }
  const counts = {}; arr.forEach(o => { if (o !== team) counts[o] = (counts[o] || 0) + 1; });
  const victims = Object.keys(counts).map(Number);
  if (!victims.length) return `<b>${pos}</b> 땅은 이미 ${T(team).name}이 모두 가지고 있어요.`;
  victims.sort((a, b) => counts[b] - counts[a] || score(b) - score(a));
  const v = victims[0], kk = arr.lastIndexOf(v); arr[kk] = team; S.lastCell = [pos, kk];
  return `<b>${pos}</b> 땅이 꽉 차서 ${T(v).name}의 <b>${landNo(pos, kk)}번</b> 땅을 빼앗았어요! (+1점)`;
}
function nextTurn(){
  if (isLastTurn()){ S.phase = 'end'; stopTimer(); SFX.fort(); return; }
  S.turn++; if (S.turn >= S.teams.length){ S.turn = 0; S.round++; if (golden()) SFX.fort(); }
  S.mode = 'choose'; S.card = null; S.res = null; S.stealer = null; S.target = null; S.fi = null; S.fpick = [{}, {}]; S.pick = {};
}
const actions = {
  nTeams(el){ S.nTeams = +el.dataset.v; },
  rounds(el){ S.rounds = +el.dataset.v; },
  timer(el){ S.timer = +el.dataset.v; },
  start(){ startGame(); SFX.claim(); },
  mute(){ S.muted = !S.muted; },
  askend(){ S.confirmEnd = true; },
  noend(){ S.confirmEnd = false; },
  end(){ S.confirmEnd = false; S.phase = 'end'; stopTimer(); },
  restart(){ const keep = { nTeams:S.nTeams, rounds:S.rounds, timer:S.timer, muted:S.muted }; S = Object.assign(freshState(), keep); stopTimer(); },
  draw(){ drawCard(); S.mode = 'land'; SFX.click(); return 'timer'; },
  land(el){ const p = el.dataset.p, k = +el.dataset.k; if (S.mode !== 'choose' || S.cells[p][k] === S.turn) return; S.target = { p, k }; drawCard(); S.mode = 'land'; SFX.click(); return 'timer'; },
  pickFort(){ S.mode = 'pickFort'; SFX.click(); },
  back(){ if (S.mode === 'land' && S.card){ S.deck.splice(Math.floor(Math.random() * (S.deck.length + 1)), 0, S.card.id); S.card = null; } S.mode = 'choose'; S.target = null; S.fi = null; S.fpick = [{}, {}]; stopTimer(); },
  fort(el){ S.fi = +el.dataset.i; S.fpick = [{}, {}]; S.fopts = FORTS[S.fi].q.map(q => meanOpts(q[1])); S.mode = 'fort'; SFX.click(); return 'timer'; },
  fsel(el){ S.fpick[+el.dataset.n].p = el.dataset.p; SFX.click(); return 'keep'; },
  fmean(el){ S.fpick[+el.dataset.n].m = el.dataset.p; SFX.click(); return 'keep'; },
  pick(el){ S.pick.p = el.dataset.p; SFX.click(); return 'keep'; },
  mpick(el){ S.pick.m = el.dataset.p; SFX.click(); return 'keep'; },
  judgeLand(){
    const c = S.card, ok = S.pick.p === c.p && S.pick.m === c.p; stopTimer();
    if (S.mode === 'land'){
      if (ok){ SFX.ok(); SFX.claim(); S.res = { ok:true, claim:claimAt(S.turn, S.target.p, S.target.k) }; S.mode = 'result'; }
      else { SFX.bad(); const pn = addPen(S.turn, S.cells[S.target.p][S.target.k] >= 0 ? STEAL_PEN : LAND_PEN); S.res = { ok:false, pen:pn.amt, note:pn.note }; S.mode = 'result'; S.log.push(c); reshuffleCard(); }
    } else {
      if (ok){ SFX.ok(); SFX.claim(); S.res = { ok:true, claim:`가로채기 성공! ` + claimAt(S.stealer, S.target.p, S.target.k) }; }
      else { SFX.bad(); const pn = addPen(S.stealer, LAND_PEN); S.res = { ok:false, claim:`${T(S.stealer).name}의 가로채기도 실패했어요. ${pn.note || `(−${pn.amt}점)`}` }; reshuffleCard(); }
      S.mode = 'result';
    }
  },
  stealer(el){ S.stealer = +el.dataset.t; S.pick = {}; S.mopts = meanOpts(S.card.p); S.mode = 'stealAns'; SFX.click(); return 'timer'; },
  reveal(){ S.res = { ok:false, claim:'' }; S.mode = 'result'; reshuffleCard(); },
  judgeFort(){
    const f = FORTS[S.fi]; stopTimer();
    const wrong = f.q.filter((q, n) => S.fpick[n].p !== q[1] || S.fpick[n].m !== q[1]).length;
    let pn = null; const prev = S.forts[S.fi];
    if (!wrong){ S.forts[S.fi] = S.turn; S.lastFort = S.fi; SFX.fort(); if (golden()) S.bonus[S.turn] = bonusOf(S.turn) + FORT_PTS; }
    else { SFX.bad(); pn = addPen(S.turn, FORT_PEN); }
    S.res = { ok:!wrong, wrong, prev, pn }; S.mode = 'fortResult';
  },
  next(){ nextTurn(); SFX.click(); },
  bonusGo(){ S.mode = 'bonusPick'; SFX.click(); },
  bonusLand(el){
    const p = el.dataset.p, k = +el.dataset.k, team = S.pendingExtra; if (S.mode !== 'bonusPick' || S.cells[p][k] >= 0) return;
    S.pendingExtra = null; SFX.claim();
    const msg = claimAt(team, p, k);
    S.res = { ok:true, claim:(S.res && S.res.claim ? S.res.claim + '<div style="margin-top:6px">' : '<div>') + '🎁 ' + msg + '</div>' };
    S.mode = S.fi != null ? 'fortResult' : 'result';
  },
  goldNext(){ S.rounds = S.turn === 0 ? S.round : S.round + 1; SFX.click(); },
};
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.castle.can, .hex.can')){ e.preventDefault(); e.target.closest('.castle.can, .hex.can').dispatchEvent(new MouseEvent('click', { bubbles:true })); } });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  const r = fn(el);
  if (r === 'keep'){ // 요새 선택: 타이머 유지하며 다시 그리기
    const keepEnd = S.tEnd; render(); if (S.timer && keepEnd){ S.tEnd = keepEnd; tickTimer(); } return;
  }
  render();
  if (r === 'timer') startTimer();
  else if (tmHandle) tickTimer();
});

/* 열린 화면에서 업데이트돼도 진행 상태 유지 */
function boot(data){ if (data && data.S && data.S.phase){ S = Object.assign(freshState(), data.S); S.confirmEnd = false; } render(); if (S.mode === 'land' || S.mode === 'stealAns' || S.mode === 'fort') startTimer(); }
try{ window.claude?.hot?.snapshot?.(() => ({ S })); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body></html>
